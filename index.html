        <div class="grid due-grid">
          <label>
            <span>Termín dokončení</span>
            <select id="dueRequired">
              <option value="ne">Ne</option>
              <option value="ano">Ano</option>
            </select>
          </label>
          <label>
            <span>Datum dokončení</span>
            <input id="dueDate" type="date">
          </label>
        </div>

        <label>
          <span>Popis zakázky <b>*</b></span>
          <textarea id="request" rows="7" placeholder="Co je potřeba na vozidle udělat…" required></textarea>
        </label>

        <label>
          <span>Rozpis provedených prací, seznam nakoupených dílů</span>
          <textarea id="workDone" rows="8" placeholder="Doplní se během nebo po opravě…"></textarea>
        </label>

        <div class="grid two">
          <label>
            <span>Datum dokončení / podpis</span>
            <input id="finishedAt" type="text" placeholder="např. 8. 9. 2026 / Novák">
          </label>
          <label class="photo-picker">
            <span>Fotografie vozidla / závady</span>
            <input id="photo" type="file" accept="image/*" capture="environment">
            <div class="photo-button">Vyfotit / vybrat fotografii</div>
          </label>
        </div>

        <div id="previewWrap" class="preview-wrap hidden">
          <img id="preview" alt="Náhled fotografie">
          <button id="removePhoto" class="link-btn" type="button">Odebrat fotografii</button>
        </div>

        <div class="actions primary-actions">
          <button id="saveBtn" class="btn primary" type="button">Uložit zakázku</button>
          <button id="pdfBtn" class="btn secondary" type="button">Vytvořit PDF</button>
          <button id="shareBtn" class="btn secondary" type="button">PDF a sdílet</button>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card saved-card">
      <div class="section-head saved-head">
        <div>
          <div class="eyebrow">ULOŽENÉ</div>
          <h2>Zakázkové listy</h2>
        </div>
        <input id="searchSaved" class="search" type="search" placeholder="Hledat klíč, ID, zadal…">
      </div>
      <div id="savedList" class="saved-list"></div>
      <p id="emptySaved" class="empty-state">Zatím tu není žádný uložený zakázkový list.</p>
    </section>

    <p class="footnote">Zakázky se zatím ukládají přímo do tohoto zařízení. PDF se vytváří lokálně a nic se neposílá na server.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
